baseURL: "https://laczak.me/"
title: laczak.me
pagination:
  paginate: 5
theme: PaperMod
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: 
  description: "Michał Łąćzak"
  author: "Michał Łączak"
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: false
    disableFingerprinting: false
    #favicon: "<link / abs url>"
    #favicon16x16: "<link / abs url>"
    #favicon32x32: "<link / abs url>"

  #label:
  #  text: "Home"
  #  iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true
    title: Michał Łączak 
    subtitle: "Hi there \U0001F44B"
    imageUrl: "images/pfp.jpg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: pfp
    #buttons:
    #  - name: Posts
    #    url: posts

  socialIcons:
    - name: email
      url: "mailto:kontakt@laczak.me"
    - name: github
      url: "https://github.com/miclacz"

markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
