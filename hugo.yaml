baseURL: "https://piwnicamichala.site/"
title: PiwnicaMichala
pagination:
  paginate: 10
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: PiwnicaMichala
  description: "Piwnica Michała"
  keywords: [Personal, Portfolio]
  author: Me
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: false
    disableFingerprinting: false
    favicon: "<link / abs url>"
    favicon16x16: "<link / abs url>"
    favicon32x32: "<link / abs url>"
    apple_touch_icon: "<link / abs url>"
    safari_pinned_tab: "<link / abs url>"

  label:
    text: "Home"
    icon: /apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: Michał Łączak 
    subtitle: "Hi there \U0001F44B"
    imageUrl: "images/pfp.jpg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: pfp
    #buttons:
    #  - name: Posts
    #    url: posts

  # home-info mode
  #homeInfoParams:
  #  Title: "Hi there \U0001F44B"
  #  Content: Welcome to my blog

  socialIcons:
    - name: email
      url: "mailto:kontakt@piwnicamichala.site"
    - name: github
      url: "https://github.com/miclacz"

  #analytics:
  #  google:
  #    SiteVerificationTag: "XYZabc"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

menu:
  main:
    - identifier: piwnicamichala
      name: piwnicamichala.site
      url: https://piwnicamichala.site
      weight: 30
